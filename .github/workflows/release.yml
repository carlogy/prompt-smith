name: Release

# Fires on version tags only (v1.2.3, v1.2.3-rc.1, ...) - NOT on every
# push to main. GoReleaser's `release` command needs a tag to compute
# the version and changelog range from; there's deliberately no
# workflow_dispatch here, because a manual run without a tag checked
# out would just fail confusingly deep inside GoReleaser rather than
# with a clear "no tag" error up front.
on:
  push:
    tags:
      - "v*.*.*"

# Deny-all at the workflow level, then grant only what this one job
# actually uses, at the job level below. Keeping the blast radius of
# the default GITHUB_TOKEN as small as possible for a workflow that
# publishes a public GitHub release.
permissions: {}

# A release run is not idempotent to interrupt: GoReleaser drafts the
# GitHub release, uploads 12 archives + checksums.txt, and (below)
# generates provenance attestations for each. Cancelling mid-flight
# (e.g. from a rapid re-push of the same tag) can leave a
# half-published release with some assets present and others missing,
# with no straightforward "resume" - so, unlike ci.yml/e2e.yml,
# cancel-in-progress is false here. The group is still keyed on the
# ref so a genuinely distinct tag doesn't queue behind an unrelated
# one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release (goreleaser)
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release + upload assets
      id-token: write # mint the OIDC token for Sigstore-signed attestations
      attestations: write # persist the attestations to the repo
    steps:
      # fetch-depth: 0 gives GoReleaser the full commit history it
      # needs to build the changelog (changelog.use: git in
      # .goreleaser.yaml walks commits between tags). fetch-tags: true
      # is separately required because actions/checkout can otherwise
      # omit tags even with full history, and GoReleaser uses the
      # previous tag to compute the changelog range and the current
      # tag to compute the release version - missing tags here is a
      # known silent-wrong-version failure mode, not just a missing
      # changelog.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Guards against a silent ldflags no-op: if
      # internal/cli.version's -X override ever stopped matching the
      # package path (e.g. after a refactor), or the ldflags in
      # .goreleaser.yaml never applied, promptsmith would silently
      # fall back to `go version -m`/runtime/debug's pseudo-version
      # heuristics (reporting things like "(devel)", "unknown", or a
      # +dirty-suffixed VCS version) instead of the release tag - and
      # that binary would already be uploaded as a release asset by
      # the time anyone noticed. This step fails the job (after the
      # fact, but loudly) rather than let a wrongly-stamped binary
      # ship unnoticed.
      #
      # GoReleaser's unpacked build dirs are named
      # dist/<build-id>_<goos>_<goarch>[_<arch-level>] - the
      # arch-level suffix (_v1 for amd64, _v8.0 for arm64) is a
      # GoReleaser implementation detail that has changed between
      # versions, so it's globbed here rather than hardcoded.
      - name: Assert version stamping
        shell: bash
        run: |
          set -euo pipefail

          # Unmatched globs expand to nothing (instead of the literal
          # pattern string) so a missing directory is caught by the
          # match-count check below rather than by a confusing
          # "command not found" from trying to execute a glob string.
          shopt -s nullglob

          expected="${{ github.ref_name }}"

          assert_version() {
            local label="$1"
            local pattern="$2"
            # shellcheck disable=SC2206 # intentional glob expansion, not word-splitting
            local matches=( $pattern )

            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "::error::${label}: expected exactly one match for pattern '${pattern}', found ${#matches[@]}: ${matches[*]:-<none>}"
              exit 1
            fi

            local binary="${matches[0]}"
            local actual
            # cobra's cmd.Printf falls back to stderr when SetOut
            # isn't called (it isn't, for this command) - capture
            # both streams so this assertion doesn't silently pass an
            # empty stdout while the real output sits on fd 2.
            actual="$("${binary}" version 2>&1)"

            echo "${label}: expected='${expected}' actual='${actual}'"

            if [[ -z "${actual}" ]]; then
              echo "::error::${label}: version output is empty (expected '${expected}')"
              exit 1
            fi

            for marker in '(devel)' 'unknown' '+dirty'; do
              if [[ "${actual}" == *"${marker}"* ]]; then
                echo "::error::${label}: version output contains forbidden marker '${marker}': actual='${actual}' expected='${expected}'"
                exit 1
              fi
            done

            if [[ "${actual}" != *"${expected}"* ]]; then
              echo "::error::${label}: version output does not contain the release tag verbatim: actual='${actual}' expected='${expected}'"
              exit 1
            fi
          }

          assert_version "promptsmith (default)" "dist/promptsmith_linux_amd64*/promptsmith"
          assert_version "promptsmith-empty" "dist/promptsmith-empty_linux_amd64*/promptsmith"

      # actions/attest-build-provenance is, as of v4, a thin wrapper
      # around actions/attest (upstream's own README says as much) -
      # using actions/attest directly for pure SLSA build provenance,
      # since that's now the current, non-wrapped path and needs no
      # extra inputs beyond subject-path to get the default provenance
      # predicate. Covers the 12 archives GoReleaser produced plus the
      # checksums file they're checksummed against.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
