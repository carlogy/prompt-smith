name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # verify runs the same checks a contributor runs locally (`make
  # verify`), plus static analysis of the -tags empty build variant
  # (embed_empty.go isn't compiled at all in a normal build/vet
  # invocation, so it needs its own explicit check). Runs once, on
  # Linux: nothing here is OS-specific, see the `test` job for
  # portability coverage.
  verify:
    name: verify (fmt, vet, staticcheck, build, test, security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # go install puts binaries in $(go env GOPATH)/bin; make it
      # available to the Makefile's bare `staticcheck`/`gosec`/
      # `govulncheck` invocations.
      - name: Add GOPATH/bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install verification tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: go mod verify
        run: go mod verify

      - name: make verify
        run: make verify

      - name: Empty build variant (-tags empty)
        run: |
          make build-empty
          go vet -tags empty ./...
          staticcheck -tags empty ./...
          gosec -quiet -tags empty ./...

  # ui-css-check regenerates internal/server/assets/static/app.css
  # (committed, embedded output) from
  # internal/server/assets/tailwind/input.css + the templates it scans
  # and fails if the result differs from what's committed - catching a
  # template edit that changes which Tailwind classes are used without
  # a corresponding `make ui-css` + commit. This is only viable because
  # input.css's `source(none)` + explicit `@source` glob (see that
  # file) make the compile a genuine, deterministic no-op on an
  # unchanged tree - Tailwind's automatic content detection would
  # otherwise scan .go files too and produce nondeterministic output.
  # Kept out of `verify` (Go-tooling-only steps) and out of the `test`
  # matrix (macOS/Windows would need platform-specific binaries for no
  # extra signal) - ubuntu-latest only.
  ui-css-check:
    name: ui-css-check (Tailwind output freshness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads TAILWINDCSS_VERSION from the Makefile - the single
      # source of truth (see its own comment) - instead of duplicating
      # the version number here.
      - name: Read pinned Tailwind CLI version
        id: tailwindcss
        run: |
          echo "version=$(make -s print-tailwindcss-version)" >> "$GITHUB_OUTPUT"
          echo "sha256_linux_x64=$(make -s print-tailwindcss-sha256-linux-x64)" >> "$GITHUB_OUTPUT"

      # Standalone CLI (https://tailwindcss.com/blog/standalone-cli),
      # not Node/npm - this repo has no committed Node toolchain and
      # none is needed at runtime (see the ui-css target's comment in
      # the Makefile). TAILWINDCSS_SHA256 is the linux-x64 checksum
      # for this exact version, read from the Makefile's
      # TAILWINDCSS_SHA256_LINUX_X64 above (see its comment there for
      # where the value comes from and why it's a hardcoded pin) - it's
      # platform-specific (only relevant to this ubuntu-latest runner)
      # and lives in the Makefile alongside TAILWINDCSS_VERSION so a
      # version bump is a single-file edit; this workflow never
      # duplicates either value.
      - name: Install Tailwind standalone CLI
        env:
          TAILWINDCSS_VERSION: ${{ steps.tailwindcss.outputs.version }}
          TAILWINDCSS_SHA256: ${{ steps.tailwindcss.outputs.sha256_linux_x64 }}
        run: |
          curl -sfLo /usr/local/bin/tailwindcss \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/v${TAILWINDCSS_VERSION}/tailwindcss-linux-x64"
          echo "${TAILWINDCSS_SHA256}  /usr/local/bin/tailwindcss" | sha256sum -c -
          chmod +x /usr/local/bin/tailwindcss

      - name: make ui-css-check
        run: make ui-css-check

  # test covers portability: the same source builds and passes on all
  # three OSes promptsmith ships for. fmt/vet/staticcheck/security are
  # not OS-specific here (no per-OS source files), so they're not
  # duplicated across the matrix - see the `verify` job.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

  # release-config guards .goreleaser.yaml on every push/PR, so a
  # broken release config (deprecated keys, schema drift, a
  # cross-compile target that stopped building) is caught here rather
  # than at tag time when it's too late to fix before a release goes
  # out. This isn't merged into `verify` or `test` because it exercises
  # a different tool (goreleaser, not go/staticcheck) against a
  # different input (.goreleaser.yaml, not source packages) - the 12
  # cross-compile targets it builds also aren't covered by `test`,
  # which only builds natively per-OS. `--snapshot` mode publishes
  # nothing: no GitHub release, no tag, no token required.
  release-config:
    name: release-config (goreleaser check + snapshot build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

      # There's no tag at PR time, so this can't assert an exact
      # version like release.yml does - instead it asserts the stamp
      # is well-formed (contains GoReleaser's "-snapshot-" marker,
      # not "(devel)"/"unknown"/"+dirty"), proving the -X ldflags
      # actually landed rather than silently no-op'ing. See
      # scripts/assert-version.sh (shared with release.yml).
      - name: Assert version stamping (snapshot)
        run: scripts/assert-version.sh -snapshot- linux_amd64
